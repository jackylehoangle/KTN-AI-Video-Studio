name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MPT_TEST_REDIS_HOST: 127.0.0.1
      MPT_TEST_REDIS_PORT: 6379
      MPT_TEST_REDIS_DB: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill

      - name: Lint Python sources
        if: matrix.python-version == '3.11'
        run: uv run --no-sync ruff check app cli.py main.py webui test docs/skill

      - name: Run unit tests with coverage
        # pytest 兼容现有 unittest.TestCase，同时会收集仓库中的 pytest 风格
        # 测试，避免测试文件已存在但 CI 没有真正执行。
        run: uv run --no-sync python -X utf8 -m coverage run -m pytest -q test

      - name: Report test coverage
        run: uv run --no-sync python -m coverage report

      - name: Export coverage report
        run: uv run --no-sync python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  windows-smoke:
    name: Windows smoke tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill

      - name: Run core service smoke tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_config.py
          test/services/test_state.py
          test/services/test_task.py
          test/services/test_task_manager.py
          test/services/test_upload_post.py
          test/services/test_controller_video.py
          test/services/test_webui_task.py
          test/services/test_webui_headless_task_actions.py

  mpt03b-e2e-video:
    name: MPT-03B real video E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Ensure FFmpeg is available
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Create local source footage
        run: |
          mkdir -p test/resources/mpt03b
          ffmpeg -y -f lavfi -i "color=c=0x203040:s=960x540:r=30:d=12"             -c:v libx264 -pix_fmt yuv420p test/resources/mpt03b/source.mp4
          ffprobe -v error -show_entries format=duration             -of default=noprint_wrappers=1:nokey=1 test/resources/mpt03b/source.mp4

      - name: Run real MoneyPrinterTurbo E2E
        run: |
          set -o pipefail
          uv run --no-sync python cli.py             --video-subject "KTN AI Video Studio baseline test"             --video-script "This is a real end to end test of the KTN AI Video Studio production engine. The system creates narration, subtitles, edits local footage, and renders a final MP4 video."             --video-source local             --video-materials "test/resources/mpt03b/source.mp4"             --voice-name "zh-CN-XiaoxiaoNeural-Female"             --bgm-type none             --font-name "BeVietnamPro-Medium.ttf"             --video-aspect "16:9"             --video-clip-duration 5             --subtitle-enabled             --stop-at video | tee mpt03b-result.json

      - name: Verify final MP4
        run: |
          VIDEO_PATH="$(find storage/tasks -type f -name 'final-*.mp4' | head -n 1)"
          test -n "$VIDEO_PATH"
          echo "VIDEO_PATH=$VIDEO_PATH" >> "$GITHUB_ENV"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height             -show_entries format=duration,size             -of json "$VIDEO_PATH"
          VIDEO_STREAMS="$(ffprobe -v error -select_streams v -show_entries stream=index -of csv=p=0 "$VIDEO_PATH" | wc -l)"
          AUDIO_STREAMS="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$VIDEO_PATH" | wc -l)"
          test "$VIDEO_STREAMS" -ge 1
          test "$AUDIO_STREAMS" -ge 1

      - name: Collect E2E artifact
        if: always()
        run: |
          mkdir -p mpt03b-artifact
          cp mpt03b-result.json mpt03b-artifact/ 2>/dev/null || true
          if [ -n "${VIDEO_PATH:-}" ] && [ -f "$VIDEO_PATH" ]; then
            cp "$VIDEO_PATH" mpt03b-artifact/final.mp4
          fi

      - name: Upload E2E artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-03b-video-e2e
          path: mpt03b-artifact
          retention-days: 7

  mpt03c-full-e2e:
    name: MPT-03C topic to final video
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check OpenRouter secret
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::Missing GitHub Actions secret OPENROUTER_API_KEY"
            exit 1
          fi

      - name: Build runtime config safely
        run: |
          cp config.example.toml config.toml
          uv run --no-sync python - <<'PY'
          import os, toml
          p="config.toml"
          cfg=toml.load(p)
          app=cfg.setdefault("app", {})
          app["llm_provider"]="openrouter"
          app["openrouter_api_key"]=os.environ["OPENROUTER_API_KEY"]
          app["openrouter_model_name"]=""
          app["openrouter_base_url"]=""
          with open(p,"w",encoding="utf-8") as fh:
              toml.dump(cfg,fh)
          print("runtime config ready: provider=openrouter; key=***")
          PY

      - name: Create local source footage
        run: |
          mkdir -p test/resources/mpt03c
          ffmpeg -y -f lavfi -i "color=c=0x182433:s=960x540:r=30:d=20"             -c:v libx264 -pix_fmt yuv420p test/resources/mpt03c/source.mp4

      - name: Run full topic-to-video E2E
        run: |
          set -o pipefail
          uv run --no-sync python cli.py             --video-subject "Why do people procrastinate on important tasks?"             --video-source local             --video-materials "test/resources/mpt03c/source.mp4"             --voice-name "zh-CN-XiaoxiaoNeural-Female"             --bgm-type none             --font-name "BeVietnamPro-Medium.ttf"             --video-aspect "16:9"             --video-clip-duration 5             --subtitle-enabled             --stop-at video | tee mpt03c-result.json

      - name: Verify AI script and final MP4
        run: |
          VIDEO_PATH="$(find storage/tasks -type f -name 'final-*.mp4' | head -n 1)"
          SCRIPT_PATH="$(find storage/tasks -type f -name 'script.json' | head -n 1)"
          test -n "$VIDEO_PATH"
          test -n "$SCRIPT_PATH"
          uv run --no-sync python - <<'PY'
          import json, glob
          paths=glob.glob("storage/tasks/*/script.json")
          assert paths, "script.json missing"
          data=json.load(open(paths[0],encoding="utf-8"))
          script=str(data.get("script") or data.get("video_script") or "").strip()
          assert len(script) >= 80, f"AI script too short: {len(script)}"
          print("AI_SCRIPT_LENGTH=",len(script))
          print("AI_SCRIPT_PREVIEW=",script[:240].replace("\n"," "))
          PY
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height             -show_entries format=duration,size -of json "$VIDEO_PATH"
          test "$(ffprobe -v error -select_streams v -show_entries stream=index -of csv=p=0 "$VIDEO_PATH" | wc -l)" -ge 1
          test "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$VIDEO_PATH" | wc -l)" -ge 1
          echo "VIDEO_PATH=$VIDEO_PATH" >> "$GITHUB_ENV"

      - name: Collect MPT-03C artifact
        if: always()
        run: |
          mkdir -p mpt03c-artifact
          cp mpt03c-result.json mpt03c-artifact/ 2>/dev/null || true
          if [ -n "${VIDEO_PATH:-}" ] && [ -f "$VIDEO_PATH" ]; then
            cp "$VIDEO_PATH" mpt03c-artifact/final.mp4
          fi
          find storage/tasks -type f -name 'script.json' -exec cp {} mpt03c-artifact/script.json \; 2>/dev/null || true

      - name: Upload MPT-03C artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-03c-full-e2e
          path: mpt03c-artifact
          retention-days: 7

  mpt03c-full-e2e-local-llm:
    name: MPT-03C topic to MP4 with local LLM
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --python 3.11

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null

      - name: Pull local Qwen model
        run: ollama pull qwen2.5:0.5b

      - name: Configure MoneyPrinterTurbo for Ollama
        run: |
          cp config.example.toml config.toml
          sed -i 's/llm_provider = "moonshot"/llm_provider = "ollama"/' config.toml
          sed -i 's#ollama_base_url = ""#ollama_base_url = "http://127.0.0.1:11434/v1"#' config.toml
          sed -i 's/ollama_model_name = ""/ollama_model_name = "qwen2.5:0.5b"/' config.toml

      - name: Create local source footage
        run: |
          mkdir -p test/resources/mpt03c
          ffmpeg -y -f lavfi -i "color=c=0x203040:s=960x540:r=30:d=20"             -c:v libx264 -pix_fmt yuv420p test/resources/mpt03c/source.mp4

      - name: Run full topic-to-video E2E
        run: |
          set -o pipefail
          uv run --no-sync python cli.py             --video-subject "Vì sao con người thường trì hoãn những việc quan trọng?"             --video-source local             --video-materials "test/resources/mpt03c/source.mp4"             --voice-name "vi-VN-HoaiMyNeural-Female"             --bgm-type none             --font-name "BeVietnamPro-Medium.ttf"             --video-aspect "16:9"             --video-clip-duration 5             --paragraph-number 1             --video-script-prompt "Viết ngắn gọn khoảng 3 câu, tự nhiên, dễ nghe."             --subtitle-enabled             --stop-at video | tee mpt03c-result.json

      - name: Verify AI script and final MP4
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw = Path("mpt03c-result.json").read_text(encoding="utf-8").strip().splitlines()
          payload = json.loads(raw[-1])
          result = payload.get("result") or payload
          script = str(result.get("script") or "").strip()
          if not script:
              raise SystemExit("AI script is empty")
          print("AI_SCRIPT:", script)
          PY
          VIDEO_PATH="$(find storage/tasks -type f -name 'final-*.mp4' | head -n 1)"
          test -n "$VIDEO_PATH"
          echo "VIDEO_PATH=$VIDEO_PATH" >> "$GITHUB_ENV"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height             -show_entries format=duration,size             -of json "$VIDEO_PATH"
          test "$(ffprobe -v error -select_streams v -show_entries stream=index -of csv=p=0 "$VIDEO_PATH" | wc -l)" -ge 1
          test "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$VIDEO_PATH" | wc -l)" -ge 1

      - name: Collect MPT-03C artifact
        if: always()
        run: |
          mkdir -p mpt03c-artifact
          cp mpt03c-result.json mpt03c-artifact/ 2>/dev/null || true
          if [ -n "${VIDEO_PATH:-}" ] && [ -f "$VIDEO_PATH" ]; then
            cp "$VIDEO_PATH" mpt03c-artifact/final.mp4
          fi
          cp /tmp/ollama.log mpt03c-artifact/ollama.log 2>/dev/null || true

      - name: Upload MPT-03C artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-03c-topic-to-mp4
          path: mpt03c-artifact
          retention-days: 7

  mpt03d-local-llm-quality-and-stock:
    name: MPT-03D upgraded local LLM and real stock gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --python 3.11

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama-mpt03d.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null

      - name: Pull upgraded Qwen model
        run: ollama pull qwen2.5:3b

      - name: Configure MoneyPrinterTurbo for upgraded local LLM
        run: |
          cp config.example.toml config.toml
          sed -i 's/llm_provider = "moonshot"/llm_provider = "ollama"/' config.toml
          sed -i 's#ollama_base_url = ""#ollama_base_url = "http://127.0.0.1:11434/v1"#' config.toml
          sed -i 's/ollama_model_name = ""/ollama_model_name = "qwen2.5:3b"/' config.toml

      - name: Generate AI script and search terms
        run: |
          set -o pipefail
          uv run --no-sync python cli.py             --video-subject "Vì sao con người thường trì hoãn những việc quan trọng?"             --paragraph-number 2             --video-script-prompt "Viết bằng tiếng Việt tự nhiên, rõ ý, không đánh số câu, không nói về việc đang viết kịch bản. Mỗi đoạn 2 đến 3 câu, phù hợp giọng đọc video."             --stop-at terms | tee mpt03d-terms.json

      - name: Validate script and generated terms quality
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          lines = Path("mpt03d-terms.json").read_text(encoding="utf-8").strip().splitlines()
          payload = json.loads(lines[-1])
          result = payload.get("result") or payload
          script = str(result.get("script") or "").strip()
          terms = result.get("terms")
          if not script:
              raise SystemExit("AI script is empty")
          if re.search(r"(?i)câu\s+(đầu tiên|hai|ba|bốn|năm|sáu|bảy|một|[0-9]+)", script):
              raise SystemExit("Script still contains numbered-sentence artifacts")
          if len(script) < 180:
              raise SystemExit("Script is too short for quality gate")
          if not terms:
              raise SystemExit("AI search terms are empty")
          print("SCRIPT_OK")
          print(script)
          print("TERMS_OK")
          print(terms)
          PY

      - name: Select available real stock provider
        id: stock
        shell: bash
        run: |
          if [ -n "$PEXELS_API_KEY" ]; then
            echo "provider=pexels" >> "$GITHUB_OUTPUT"
            echo "key=$PEXELS_API_KEY" >> "$GITHUB_OUTPUT"
          elif [ -n "$PIXABAY_API_KEY" ]; then
            echo "provider=pixabay" >> "$GITHUB_OUTPUT"
            echo "key=$PIXABAY_API_KEY" >> "$GITHUB_OUTPUT"
          elif [ -n "$COVERR_API_KEY" ]; then
            echo "provider=coverr" >> "$GITHUB_OUTPUT"
            echo "key=$COVERR_API_KEY" >> "$GITHUB_OUTPUT"
          else
            echo "provider=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure selected stock provider
        if: steps.stock.outputs.provider != 'none'
        env:
          STOCK_PROVIDER: ${{ steps.stock.outputs.provider }}
          STOCK_KEY: ${{ steps.stock.outputs.key }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path("config.toml")
          s=p.read_text(encoding="utf-8")
          provider=os.environ["STOCK_PROVIDER"]
          key=os.environ["STOCK_KEY"].replace('"','')
          if provider=="pexels":
              s=s.replace("pexels_api_keys = []", f'pexels_api_keys = ["{key}"]')
          elif provider=="pixabay":
              s=s.replace("pixabay_api_keys = []", f'pixabay_api_keys = ["{key}"]')
          elif provider=="coverr":
              s=s.replace("coverr_api_keys = []", f'coverr_api_keys = ["{key}"]')
          p.write_text(s, encoding="utf-8")
          PY

      - name: Real stock retrieval and final render
        if: steps.stock.outputs.provider != 'none'
        env:
          STOCK_PROVIDER: ${{ steps.stock.outputs.provider }}
        run: |
          set -o pipefail
          uv run --no-sync python cli.py             --video-subject "Vì sao con người thường trì hoãn những việc quan trọng?"             --video-source "$STOCK_PROVIDER"             --voice-name "vi-VN-HoaiMyNeural-Female"             --bgm-type none             --font-name "BeVietnamPro-Medium.ttf"             --video-aspect "16:9"             --video-clip-duration 4             --paragraph-number 1             --video-script-prompt "Viết bằng tiếng Việt tự nhiên, rõ ý, không đánh số câu, khoảng 3 câu."             --subtitle-enabled             --stop-at video | tee mpt03d-stock-result.json

      - name: Verify real stock source records and final MP4
        if: steps.stock.outputs.provider != 'none'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path("storage/tasks").glob("*/script.json"))
          if not files:
              raise SystemExit("script.json not found")
          data=json.loads(files[-1].read_text(encoding="utf-8"))
          sources=data.get("material_sources") or []
          if not sources:
              raise SystemExit("No real stock material source records")
          print("MATERIAL_SOURCES_OK")
          for x in sources:
              print({k:x.get(k) for k in ("provider","search_term","asset_id","source_page","local_file")})
          PY
          VIDEO_PATH="$(find storage/tasks -type f -name 'final-*.mp4' | tail -n 1)"
          test -n "$VIDEO_PATH"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height             -show_entries format=duration,size -of json "$VIDEO_PATH"

      - name: Report stock key gate
        if: steps.stock.outputs.provider == 'none'
        run: |
          echo "STOCK_KEY_GATE=BLOCKED"
          echo "No PEXELS_API_KEY, PIXABAY_API_KEY, or COVERR_API_KEY GitHub Actions secret is configured."
          exit 2

      - name: Collect MPT-03D diagnostics
        if: always()
        run: |
          mkdir -p mpt03d-artifact
          cp mpt03d-terms.json mpt03d-artifact/ 2>/dev/null || true
          cp mpt03d-stock-result.json mpt03d-artifact/ 2>/dev/null || true
          cp /tmp/ollama-mpt03d.log mpt03d-artifact/ 2>/dev/null || true
          find storage/tasks -type f -name 'final-*.mp4' -exec cp {} mpt03d-artifact/final.mp4 \; 2>/dev/null || true

      - name: Upload MPT-03D artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-03d-local-llm-and-stock
          path: mpt03d-artifact
          retention-days: 7

  mpt03d-qwen7b-quality:
    name: MPT-03D Qwen 7B script and English terms quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
